services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: haydigo
      POSTGRES_PASSWORD: haydigo
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U haydigo']
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ['-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'

volumes:
  postgres-data:
